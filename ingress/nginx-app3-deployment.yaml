apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app3
  namespace: default
  labels:
    app: nginx-app3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app3
  template:
    metadata:
      labels:
        app: nginx-app3
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/
        - name: html-content
          mountPath: /usr/share/nginx/html/
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-app3-config
      - name: html-content
        configMap:
          name: nginx-app3-html
