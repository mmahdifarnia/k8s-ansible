apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: metallb-system
  labels:
    app: nginx-loadbalancer
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 80
    nodePort: 30000
  selector:
    app: nginx  # Corrected selector to match nginx deployment
  type: LoadBalancer
