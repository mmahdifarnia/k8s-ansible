apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: kafka-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv-1
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: kafka-storage
  local:
    path: /var/lib/kafka/kafka-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-pv-2
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: kafka-storage
  local:
    path: /var/lib/kafka/kafka-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka
  labels:
    app: kafka-broker
    component: broker
spec:
  serviceName: kafka-svc
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-broker
      component: broker
  template:
    metadata:
      labels:
        app: kafka-broker
        component: broker
    spec:
      subdomain: kafka-svc
      containers:
        - name: kafka-container
          image: doughgle/kafka-kraft
          ports:
            - containerPort: 9092
              name: internal
            - containerPort: 9093
              name: controller
            - containerPort: 9094
              name: external
          env:
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CLUSTER_ID
              value: "bXktY2x1c3Rlci0xMjM0NQ=="
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "2"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_NUM_PARTITIONS
              value: "2"
            - name: KAFKA_LOG_DIRS
              value: "/mnt/kafka"
          command:
            - /bin/bash
            - -c
            - |
              # Extract numeric node ID from pod name (kafka-0 -> 0, kafka-1 -> 1)
              NODE_ID=${HOSTNAME##*-}

              echo "Configuring Kafka with node.id=$NODE_ID"

              # Use single external port for all brokers (nginx load balances)
              EXTERNAL_PORT=30092

              # Update the server.properties file with the correct node.id
              sed -i "s/^node.id=.*/node.id=$NODE_ID/" /opt/kafka/config/kraft/server.properties

              # Update controller.quorum.voters to include both brokers
              sed -i "s|^controller.quorum.voters=.*|controller.quorum.voters=0@kafka-0.kafka-svc.kafka.svc.cluster.local:9093,1@kafka-1.kafka-svc.kafka.svc.cluster.local:9093|" /opt/kafka/config/kraft/server.properties

              # Update listeners
              sed -i "s|^listeners=.*|listeners=INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093|" /opt/kafka/config/kraft/server.properties

              # Update advertised.listeners with BOTH internal and external addresses
              sed -i "s|^advertised.listeners=.*|advertised.listeners=INTERNAL://${HOSTNAME}.kafka-svc.kafka.svc.cluster.local:9092,EXTERNAL://192.168.56.111:${EXTERNAL_PORT}|" /opt/kafka/config/kraft/server.properties

              # Update listener.security.protocol.map
              sed -i "s|^listener.security.protocol.map=.*|listener.security.protocol.map=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT|" /opt/kafka/config/kraft/server.properties

              # Update inter.broker.listener.name
              sed -i "s|^inter.broker.listener.name=.*|inter.broker.listener.name=INTERNAL|" /opt/kafka/config/kraft/server.properties

              # Format the storage if not already formatted
              if [ ! -f /mnt/kafka/meta.properties ]; then
                echo "Formatting Kafka storage with node.id=$NODE_ID..."
                /opt/kafka/bin/kafka-storage.sh format -t $KAFKA_CLUSTER_ID -c /opt/kafka/config/kraft/server.properties
              else
                echo "Kafka storage already formatted, skipping format step"
              fi

              # Start Kafka
              echo "Starting Kafka broker..."
              exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/kraft/server.properties
          volumeMounts:
            - name: data
              mountPath: /mnt/kafka
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Wait for Kafka to start
                    until /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list; do
                      echo "Waiting for Kafka to start..."
                      sleep 5
                    done
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: "kafka-storage"
        resources:
          requests:
            storage: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-svc
  namespace: kafka
  labels:
    app: kafka-broker
    component: broker
spec:
  publishNotReadyAddresses: true
  clusterIP: None # Headless service for StatefulSet
  selector:
    app: kafka-broker
    component: broker
  ports:
    - name: "9092"
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: "9093"
      port: 9093
      protocol: TCP
      targetPort: 9093
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-nodeport
  namespace: kafka
  labels:
    app: kafka-broker
    component: broker
spec:
  type: NodePort
  selector:
    app: kafka-broker
    component: broker
  ports:
    - name: kafka-external
      port: 9094
      targetPort: 9094
      nodePort: 30092
      protocol: TCP
  # Optional: Make it external to the cluster
  externalTrafficPolicy: Cluster
