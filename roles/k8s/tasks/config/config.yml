# ============================================
# Step 2: Kernel Parameters
# ============================================
- name: Step 2 - Configure kernel parameters
  tags:
    - kernel
    - always
  block:
    - name: Update apt package index
      ansible.builtin.apt:
        update_cache: true

    - name: Install required packages for Kubernetes installation
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - python3-pip
          - python3-kubernetes
        state: present

    - name: Load required kernel modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules load on boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Determine node IP using hostvars for nodeX pattern
      ansible.builtin.set_fact:
        kubelet_node_ip: "{{ k8s_kubelet_node_ips[ansible_hostname] }}"

    - name: Fail if node IP cannot be determined
      ansible.builtin.fail:
        msg: "Could not determine node IP for {{ inventory_hostname }}. Please define it in k8s_kubelet_node_ips."
      when: kubelet_node_ip is not defined

    - name: Create kubelet configuration directory
      ansible.builtin.file:
        path: "{{ k8s_kubelet_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Configure kubelet with node IP
      ansible.builtin.template:
        src: kubelet_node_ip.j2
        dest: "{{ k8s_kubelet_config_path }}"
        owner: root
        group: root
        mode: '0644'
        backup: true
      become: true

    - name: Set sysctl parameters for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: 1 }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: 1 }
        - { name: 'net.ipv4.ip_forward', value: 1 }

    - name: Apply sysctl params without reboot
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true
