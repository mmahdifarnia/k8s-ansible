# ============================================
# Step 7: Install Flannel CNI (Only if reset)
# ============================================
- name: Step 7 - Install Flannel CNI
  when: true
  become: true
  tags:
    - flannel
  block:
    - name: Download Flannel manifest
      ansible.builtin.get_url:
        url: https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
        dest: "{{ k8s_home }}/kube-flannel.yml"
        mode: '0644'
        timeout: 30

    - name: Apply Flannel CNI
      kubernetes.core.k8s:
        state: present
        src: "{{ k8s_home }}/kube-flannel.yml"
        kubeconfig: "{{ k8s_home }}/.kube/config"
