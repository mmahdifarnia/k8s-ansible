# nginx.conf - Load Balancer for Kubernetes + MetalLB
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# Stream block for TCP load balancing
stream {
    # Logging
    log_format basic '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr" '
                     '"$upstream_bytes_sent" "$upstream_bytes_received" "$upstream_connect_time"';
    
    access_log /var/log/nginx/stream.log basic;
    error_log /var/log/nginx/stream_error.log;

    # Upstream pointing to MetalLB LoadBalancer IP
    upstream my_loadbalancer {
        # 🟢 Use the LoadBalancer EXTERNAL IP (MetalLB assigns this)
        # Check with: kubectl get svc my-loadbalancer -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        server 192.168.56.111:8080;  # ← Replace with your actual LoadBalancer IP:port
        # If you have multiple LoadBalancer services, add more servers here
        least_conn;
    }
    
    server {
        listen 80;  # ← Matches docker-compose port mapping
        proxy_pass my_loadbalancer;
        proxy_timeout 30s;
        proxy_connect_timeout 30s;
        proxy_socket_keepalive on;
        error_log /var/log/nginx/my_loadbalancer_error.log;
    }
}