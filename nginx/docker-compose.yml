version: "3.8"

services:
  nginx-loadbalancer:
    build: .
    container_name: nginx-lb
    healthcheck:
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    ports:
      - "80:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    restart: unless-stopped
