#---------------------------------------------------------------------
# HAProxy Configuration - Load Balancer for Redis and Kafka
#---------------------------------------------------------------------

#---------------------------------------------------------------------
# Global settings
#---------------------------------------------------------------------
global
    log stdout format raw local0
    log stdout format raw local1 notice
    
    # Performance tuning
    maxconn 4096
    nbthread 2
    
    # Stats socket for runtime API (commented out - use HTTP stats instead)
    # stats socket /var/run/haproxy.sock mode 660 level admin
    # stats timeout 30s
    
    # Security
    user haproxy
    group haproxy
    
    # Daemon mode disabled for Docker (logs to stdout)
    # daemon

#---------------------------------------------------------------------
# Default settings
#---------------------------------------------------------------------
defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    
    # Timeouts
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    
    # Error handling
    retries 3
    option redispatch
    
    # Performance
    maxconn 3000

#---------------------------------------------------------------------
# HAProxy Statistics Dashboard
#---------------------------------------------------------------------
frontend stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats show-legends
    stats show-desc HAProxy Load Balancer Statistics
    
    # Health check endpoint
    monitor-uri /health

#---------------------------------------------------------------------
# Redis Load Balancer - Read/Write Splitting
#---------------------------------------------------------------------
# Write operations (Master) - Port 6379
frontend redis_write_frontend
    bind *:6379
    mode tcp
    option tcplog
    
    # Connection limits
    maxconn 1024
    
    # Timeouts specific to Redis
    timeout client 30s
    
    default_backend redis_write_backend

# Read operations (Replica) - Port 6380
frontend redis_read_frontend
    bind *:6380
    mode tcp
    option tcplog
    
    # Connection limits
    maxconn 1024
    
    # Timeouts specific to Redis
    timeout client 30s
    
    default_backend redis_read_backend

# Backend for write operations (Master only)
backend redis_write_backend
    mode tcp
    
    # Timeouts specific to Redis
    timeout connect 3s
    timeout server 30s
    
    # Health check
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    
    # Master server for writes
    server redis1 192.168.56.111:30917 check inter 5s fall 3 rise 2

# Backend for read operations (Replica only)
backend redis_read_backend
    mode tcp
    balance leastconn
    
    # Timeouts specific to Redis
    timeout connect 3s
    timeout server 30s
    
    # Health check
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    
    # Replica server for reads
    server redis2 192.168.56.112:30917 check inter 5s fall 3 rise 2

#---------------------------------------------------------------------
# Kafka Load Balancer
#---------------------------------------------------------------------
frontend kafka_frontend
    bind *:9092
    mode tcp
    option tcplog
    
    # Connection limits
    maxconn 1024
    
    # Timeouts specific to Kafka
    timeout client 60s
    
    default_backend kafka_backend

backend kafka_backend
    mode tcp
    balance leastconn
    
    # Timeouts specific to Kafka
    timeout connect 5s
    timeout server 60s
    
    # Health check - simple TCP connection check
    option tcp-check
    tcp-check connect
    
    # Backend servers (replace with your actual Kubernetes node IPs)
    server kafka1 192.168.56.111:30092 check inter 10s fall 3 rise 2
    server kafka2 192.168.56.112:30092 check inter 10s fall 3 rise 2

